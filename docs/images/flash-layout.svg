<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What flashing OpenWrt changes on the WD My Cloud EX2 Ultra</title>
  <rect x="0" y="0" width="900" height="636" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="32" y="44" font-size="20" font-weight="700" fill="#1f2328">What flashing changes</text>
  <text x="32" y="68" font-size="13.5" fill="#59636e">256 MB of NAND flash in 8 parts. Only two are rewritten; your disks are never touched.</text>

  <!-- legend -->
  <rect x="604" y="30" width="14" height="14" rx="3" fill="#1a7f37"/>
  <text x="624" y="42" font-size="12.5" fill="#1f2328">Replaced by OpenWrt</text>
  <rect x="604" y="52" width="14" height="14" rx="3" fill="#ffffff" stroke="#afb8c1"/>
  <text x="624" y="64" font-size="12.5" fill="#1f2328">Left as it is</text>

  <!-- column heads -->
  <g font-size="11.5" font-weight="600" fill="#59636e" letter-spacing="0.6">
    <text x="48" y="104">PART</text>
    <text x="196" y="104">SIZE</text>
    <text x="276" y="104">BEFORE (WD)</text>
    <text x="520" y="104">AFTER</text>
    <text x="740" y="104">WRITTEN BY</text>
  </g>

  <!-- mtd0 -->
  <g transform="translate(32,116)">
    <rect width="836" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="29" font-size="14" font-weight="600" fill="#1f2328">mtd0 · U-Boot</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">5 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">Bootloader</text>
    <text x="488" y="29" font-size="13.5" fill="#59636e">unchanged</text>
  </g>
  <!-- mtd1 -->
  <g transform="translate(32,170)">
    <rect width="836" height="46" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <rect width="6" height="46" rx="3" fill="#1a7f37"/>
    <text x="16" y="29" font-size="14" font-weight="700" fill="#1f2328">mtd1 · kernel</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">5 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD Linux kernel</text>
    <text x="488" y="29" font-size="13.5" font-weight="600" fill="#1a7f37">OpenWrt kernel</text>
    <text x="708" y="24" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">flash_eraseall</text>
    <text x="708" y="38" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">+ nandwrite</text>
  </g>
  <!-- mtd2 -->
  <g transform="translate(32,224)">
    <rect width="836" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="29" font-size="14" font-weight="600" fill="#1f2328">mtd2 · uRamdisk</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">5 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD start-up files</text>
    <text x="488" y="29" font-size="13.5" fill="#59636e">unchanged (no longer used)</text>
  </g>
  <!-- mtd3 -->
  <g transform="translate(32,278)">
    <rect width="836" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <rect width="6" height="58" rx="3" fill="#1a7f37"/>
    <text x="16" y="35" font-size="14" font-weight="700" fill="#1f2328">mtd3 · ubi</text>
    <text x="164" y="35" font-size="13.5" fill="#59636e">185 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD system</text>
    <text x="244" y="45" font-size="12" fill="#59636e">(image.cfs)</text>
    <text x="488" y="29" font-size="13.5" font-weight="600" fill="#1a7f37">OpenWrt system</text>
    <text x="488" y="45" font-size="12" fill="#59636e">+ your settings</text>
    <text x="708" y="35" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">ubiformat</text>
  </g>
  <!-- mtd4..7 -->
  <g transform="translate(32,344)">
    <rect width="836" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="29" font-size="14" font-weight="600" fill="#1f2328">mtd4 · rescue fw</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">15 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD rescue firmware</text>
    <text x="488" y="29" font-size="13.5" fill="#59636e">unchanged</text>
  </g>
  <g transform="translate(32,398)">
    <rect width="836" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="29" font-size="14" font-weight="600" fill="#1f2328">mtd5 · config</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">20 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD settings, MAC address</text>
    <text x="488" y="29" font-size="13.5" fill="#59636e">unchanged (OpenWrt reads the MAC)</text>
  </g>
  <g transform="translate(32,452)">
    <rect width="836" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="29" font-size="14" font-weight="600" fill="#1f2328">mtd6 · reserve1</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">10 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD reserved</text>
    <text x="488" y="29" font-size="13.5" fill="#59636e">unchanged</text>
  </g>
  <g transform="translate(32,506)">
    <rect width="836" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="29" font-size="14" font-weight="600" fill="#1f2328">mtd7 · reserve2</text>
    <text x="164" y="29" font-size="13.5" fill="#59636e">10 MiB</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">WD factory info</text>
    <text x="488" y="29" font-size="13.5" fill="#59636e">unchanged</text>
  </g>

  <!-- disks -->
  <g transform="translate(32,568)">
    <rect width="836" height="46" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="16" y="29" font-size="14" font-weight="700" fill="#1f2328">Disks · bay 1 + bay 2</text>
    <text x="244" y="29" font-size="13.5" fill="#1f2328">Your files (WD RAID 1 mirror)</text>
    <text x="488" y="29" font-size="13.5" font-weight="600" fill="#0969da">untouched: reused as they are</text>
  </g>
</svg>
